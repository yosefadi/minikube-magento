---
- name: Tear the Minikube cluster down
  hosts: minikube
  become: true
  gather_facts: false

  tasks:
    - name: Stop and disable the minikube unit
      ansible.builtin.systemd_service:
        name: minikube
        state: stopped
        enabled: false
      failed_when: false

    - name: Delete all minikube profiles
      ansible.builtin.command: /usr/local/bin/minikube delete --all --purge
      environment:
        MINIKUBE_IN_STYLE: "false"
      changed_when: true
      failed_when: false

    - name: Stop kubelet if still running
      ansible.builtin.systemd_service:
        name: kubelet
        state: stopped
      failed_when: false

    - name: Remove minikube and kubernetes state directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /root/.minikube
        - /root/.kube
        - /var/lib/minikube
        - /var/lib/kubelet
        - /etc/kubernetes
        - /etc/cni/net.d
        - /tmp/hostpath-provisioner
        - /tmp/hostpath_pv

    - name: Uninstall FluxCD Helm release
      ansible.builtin.command:
        cmd: helm uninstall flux --namespace flux-system --ignore-not-found
      changed_when: true
      failed_when: false

    - name: Delete FluxCD namespace
      ansible.builtin.command:
        cmd: kubectl delete namespace flux-system --ignore-not-found --wait=false
      changed_when: true
      failed_when: false

    - name: Remove temporary FluxCD files from target
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/fluxcd-ssh-key
        - /tmp/fluxcd-ssh-key.gitrepository.yaml
        - /tmp/fluxcd-ssh-key.kustomization.yaml
      failed_when: false

    - name: Delete infrastructure namespace and all resources
      ansible.builtin.command:
        cmd: kubectl delete namespace infrastructure --ignore-not-found --wait=false
      changed_when: true
      failed_when: false

    - name: Delete apps namespace and all resources
      ansible.builtin.command:
        cmd: kubectl delete namespace apps --ignore-not-found --wait=false
      changed_when: true
      failed_when: false
