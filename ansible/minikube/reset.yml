---
- name: Tear the Minikube cluster down
  hosts: minikube
  become: true
  gather_facts: false

  tasks:
    - name: Stop and disable the minikube unit
      ansible.builtin.systemd_service:
        name: minikube
        state: stopped
        enabled: false
      failed_when: false

    - name: Delete all minikube profiles
      ansible.builtin.command: /usr/local/bin/minikube delete --all --purge
      environment:
        MINIKUBE_IN_STYLE: "false"
      changed_when: true
      failed_when: false

    - name: Stop kubelet if still running
      ansible.builtin.systemd_service:
        name: kubelet
        state: stopped
      failed_when: false

    - name: Remove minikube and kubernetes state directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /root/.minikube
        - /root/.kube
        - /var/lib/minikube
        - /var/lib/kubelet
        - /etc/kubernetes
        - /etc/cni/net.d
