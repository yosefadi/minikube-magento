---
- name: Remove distro-packaged Docker variants
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-doc
      - docker-compose
      - podman-docker
      - containerd
      - runc
    state: absent

- name: Install the Docker apt signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Verify the Docker GPG key fingerprint
  ansible.builtin.command:
    argv:
      - gpg
      - --show-keys
      - --keyid-format=long
      - --fingerprint
      - /etc/apt/keyrings/docker.asc
  register: docker_gpg_verify
  changed_when: false
  failed_when: >
    '9DC8 5822 9FC7 DD38 854A  E2D8 8D81 803C 0EBF CD88' not in
    docker_gpg_verify.stdout

- name: Configure the Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "https://download.docker.com/linux/ubuntu"
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [stable]
    architectures: ["{{ docker_apt_arch }}"]
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
    enabled: true

- name: Install Docker Engine
  ansible.builtin.apt:
    update_cache: true
    name: >-
      {{ docker_packages
         | map('regex_replace', '$', '=' ~ docker_version)
         | list
         if docker_version != 'latest' else docker_packages }}
    state: present

- name: Manage /etc/docker/daemon.json
  # --driver=none reconfigures the HOST's own Docker daemon during
  # `minikube start` (exec-opts.native.cgroupdriver=systemd, storage-driver)
  # so its cgroup driver matches kubelet's — verified live that our own
  # daemon.json management fights this: minikube writes its config during
  # the node bootstrap, and the very next playbook run detects that as
  # "drift" from our minimal log-driver-only config and overwrites it back,
  # restarting Docker and stripping the cgroup-driver alignment minikube
  # just set up. The docker driver's node runs its own separate nested
  # daemon and never touches the host's file, so this only matters for
  # --driver=none — defer to minikube entirely there.
  when: minikube_driver != 'none'
  block:
    - name: Check if daemon.json needs updating
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: docker_daemon_current
      failed_when: false

    - name: Compute expected daemon.json content
      ansible.builtin.set_fact:
        docker_daemon_expected: "{{ docker_daemon_options | to_nice_json }}"

    - name: Write /etc/docker/daemon.json
      ansible.builtin.copy:
        content: "{{ docker_daemon_expected }}\n"
        dest: /etc/docker/daemon.json
        mode: "0644"
      when: docker_daemon_current.content | default('') | b64decode | trim != docker_daemon_expected | trim
      notify: Restart docker

- name: Ensure Docker is enabled and running
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true
    daemon_reload: true
