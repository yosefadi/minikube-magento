---
- name: Ensure containerd is enabled and running
  ansible.builtin.systemd_service:
    name: containerd
    state: started
    enabled: true

- name: Create minikube state directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - "{{ minikube_home }}/.minikube"
    - "{{ minikube_home }}/.kube"

- name: Remove built-in storage-provisioner symlinks that conflict with OpenEBS
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/hostpath-provisioner
    - /tmp/hostpath_pv
  failed_when: false

- name: Check the installed minikube version
  ansible.builtin.command: "{{ minikube_bin }} version --short"
  register: minikube_installed
  changed_when: false
  failed_when: false

- name: Resolve the latest minikube version
  ansible.builtin.uri:
    url: https://api.github.com/repos/kubernetes/minikube/releases/latest
    return_content: true
  register: minikube_latest
  when: minikube_version == 'latest'
  changed_when: false
  failed_when: false

- name: Set the target minikube version
  ansible.builtin.set_fact:
    minikube_target_version: >-
      {{ (minikube_latest.json.tag_name | default(minikube_version))
         if minikube_version == 'latest' else minikube_version }}

- name: Install the minikube binary
  when: minikube_target_version not in (minikube_installed.stdout | default('')) and minikube_target_version != minikube_version
  ansible.builtin.get_url:
    url: >-
      https://storage.googleapis.com/minikube/releases/{{ minikube_target_version }}/minikube-linux-{{ minikube_arch }}
    dest: "{{ minikube_bin }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart minikube

- name: Install the minikube systemd unit
  ansible.builtin.template:
    src: minikube.service.j2
    dest: /etc/systemd/system/minikube.service
    mode: "0644"
  notify: Restart minikube

- name: Flush pending restart handlers before starting the cluster
  ansible.builtin.meta: flush_handlers

- name: Enable and start the minikube cluster
  ansible.builtin.systemd_service:
    name: minikube
    state: "{{ 'started' if minikube_start_cluster | bool else 'stopped' }}"
    enabled: "{{ minikube_start_cluster | bool }}"
    daemon_reload: true

- name: Apply pending restarts before probing the cluster
  ansible.builtin.meta: flush_handlers

- name: Stop here when the cluster is intentionally left down
  ansible.builtin.meta: end_host
  when: not (minikube_start_cluster | bool)

- name: Wait for the control-plane node to become Ready
  ansible.builtin.command: >-
    kubectl wait --for=condition=Ready nodes --all --timeout=300s
  environment:
    KUBECONFIG: "{{ minikube_home }}/.kube/config"
  changed_when: false

- name: Enforce the node container's CPU limit
  # minikube's docker driver passes --cpus to `minikube start`, but on at
  # least this host it never turns into an actual `docker run --cpus`
  # constraint: verified live that a freshly (re)started cluster left
  # HostConfig.NanoCpus at 0 / cgroup cpu.max at "max" (unlimited) despite
  # requesting minikube_cpus, while --memory *was* correctly enforced as a
  # real cgroup limit. `docker update --cpus` applies live, no restart
  # needed, so this just re-asserts it after every start. Docker-driver only
  # — --driver=none runs kubelet on the host directly, so there's no
  # "minikube" container to inspect/limit.
  when: minikube_driver == 'docker' and minikube_cpus is number
  block:
    - name: Check the node container's current CPU limit
      ansible.builtin.command:
        argv: [docker, inspect, minikube, --format, "{{ '{{' }}.HostConfig.NanoCpus{{ '}}' }}"]
      register: minikube_current_nanocpus
      changed_when: false

    - name: Apply the CPU limit to the node container
      ansible.builtin.command:
        argv: [docker, update, "--cpus={{ minikube_cpus }}", minikube]
      when: (minikube_current_nanocpus.stdout | trim | int) != (minikube_cpus * 1000000000) | int
      changed_when: true

- name: Enable managed LimitedSwap kubelet behavior
  when: minikube_enable_limited_swap | bool
  block:
    - name: Check whether LimitedSwap is already configured
      ansible.builtin.command:
        argv:
          - grep
          - -q
          - "swapBehavior: LimitedSwap"
          - /var/lib/kubelet/config.yaml
      register: minikube_limited_swap_swap_check
      changed_when: false
      failed_when: false

    - name: Check whether the NodeSwap feature gate is already enabled
      ansible.builtin.command:
        argv:
          - grep
          - -q
          - "NodeSwap: true"
          - /var/lib/kubelet/config.yaml
      register: minikube_limited_swap_feature_check
      changed_when: false
      failed_when: false

    - name: Patch the kubelet config and restart kubelet
      when: minikube_limited_swap_swap_check.rc != 0 or minikube_limited_swap_feature_check.rc != 0
      block:
        - name: Set memorySwap.swapBehavior to LimitedSwap
          ansible.builtin.replace:
            path: /var/lib/kubelet/config.yaml
            regexp: '^memorySwap: {}$'
            replace: "memorySwap:\n  swapBehavior: LimitedSwap"

        - name: Enable the NodeSwap kubelet feature gate
          ansible.builtin.command:
            argv:
              - sh
              - -c
              - "printf 'featureGates:\\n  NodeSwap: true\\n' >> /var/lib/kubelet/config.yaml"
          changed_when: true

        - name: Restart kubelet to apply the new config
          ansible.builtin.systemd_service:
            name: kubelet
            daemon_reload: true
            state: restarted

        - name: Wait for the control-plane node to become Ready again
          ansible.builtin.command: >-
            kubectl wait --for=condition=Ready nodes --all --timeout=120s
          environment:
            KUBECONFIG: "{{ minikube_home }}/.kube/config"
          changed_when: false

- name: Collect the current addon states
  ansible.builtin.command: "{{ minikube_bin }} addons list -o json"
  environment:
    MINIKUBE_IN_STYLE: "false"
  register: minikube_addons_state
  changed_when: false

- name: Enable the requested minikube addons
  ansible.builtin.command: "{{ minikube_bin }} addons enable {{ item }}"
  environment:
    MINIKUBE_IN_STYLE: "false"
  loop: "{{ minikube_addons | difference(minikube_addons_enabled) }}"
  changed_when: true
  vars:
    minikube_addons_enabled: >-
      {{ (minikube_addons_state.stdout | from_json) | dict2items
         | selectattr('value.Status', 'equalto', 'enabled')
         | map(attribute='key') | list }}

- name: Disable minikube's built-in storage-provisioner
  ansible.builtin.command: "{{ minikube_bin }} addons disable storage-provisioner"
  environment:
    MINIKUBE_IN_STYLE: "false"
  when: >-
    'storage-provisioner' in (minikube_addons_state.stdout | from_json)
    and (minikube_addons_state.stdout | from_json)['storage-provisioner'].Status == 'enabled'
  changed_when: true

- name: Disable minikube's default-storageclass addon
  ansible.builtin.command: "{{ minikube_bin }} addons disable default-storageclass"
  environment:
    MINIKUBE_IN_STYLE: "false"
  when: >-
    'default-storageclass' in (minikube_addons_state.stdout | from_json)
    and (minikube_addons_state.stdout | from_json)['default-storageclass'].Status == 'enabled'
  changed_when: true

- name: Set OpenEBS hostpath as the default StorageClass
  ansible.builtin.shell:
    cmd: >
      kubectl annotate storageclass openebs-hostpath
      storageclass.kubernetes.io/is-default-class=true
      --overwrite
  changed_when: true
  failed_when: false

- name: Read the minikube kubeconfig
  ansible.builtin.slurp:
    src: "{{ minikube_home }}/.kube/config"
  register: minikube_kubeconfig
  when: minikube_expose_apiserver | bool

- name: Export a kubeconfig for remote access
  when: minikube_expose_apiserver | bool
  block:
    # Only meaningful for the docker driver: minikube's docker/podman driver
    # publishes the apiserver port through a Docker port mapping, and the
    # actual host-side port isn't guaranteed to equal the requested
    # --apiserver-port. --driver=none runs kubelet directly on the host, so
    # there's no NAT — the configured port IS the real one.
    - name: Discover the published API server host port
      ansible.builtin.command: "docker port minikube {{ minikube_apiserver_port }}/tcp"
      register: minikube_apiserver_port_raw
      when: minikube_driver == 'docker'
      changed_when: false

    - name: Ensure the output directory exists on the control node
      ansible.builtin.file:
        path: "{{ playbook_dir }}/output"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Write the remote-access kubeconfig to the control node
      ansible.builtin.copy:
        content: >-
          {{ (minikube_kubeconfig.content | b64decode)
             | regex_replace('server: https://[0-9.]+:[0-9]+',
                              'server: https://' ~ minikube_remote_access_host ~ ':' ~ minikube_apiserver_host_port) }}
        dest: "{{ playbook_dir }}/output/kubectl-{{ minikube_env_name }}.yaml"
        mode: "0600"
      delegate_to: localhost
      become: false
      vars:
        minikube_apiserver_host_port: >-
          {{ (minikube_apiserver_port_raw.stdout | trim | regex_replace('^.*:', ''))
             if minikube_driver == 'docker' else (minikube_apiserver_port | string) }}