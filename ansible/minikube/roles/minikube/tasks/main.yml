---
- name: Create the minikube service account
  ansible.builtin.user:
    name: "{{ minikube_user }}"
    home: "{{ minikube_home }}"
    shell: /bin/bash
    groups: docker
    append: true
    create_home: true
    state: present

- name: Create minikube state directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ minikube_user }}"
    group: "{{ minikube_user }}"
    mode: "0750"
  loop:
    - "{{ minikube_home }}/.minikube"
    - "{{ minikube_home }}/.kube"
    # Pre-created so the tasks that become the minikube user do not have to
    # invent their own remote_tmp.
    - "{{ minikube_home }}/.ansible/tmp"

- name: Check the installed minikube version
  ansible.builtin.command: "{{ minikube_bin }} version --short"
  register: minikube_installed
  changed_when: false
  failed_when: false

- name: Resolve the latest minikube version
  ansible.builtin.uri:
    url: https://api.github.com/repos/kubernetes/minikube/releases/latest
    return_content: true
  register: minikube_latest
  when: minikube_version == 'latest'
  changed_when: false

- name: Set the target minikube version
  ansible.builtin.set_fact:
    minikube_target_version: >-
      {{ (minikube_latest.json.tag_name) if minikube_version == 'latest' else minikube_version }}

- name: Install the minikube binary
  when: minikube_target_version not in (minikube_installed.stdout | default(''))
  ansible.builtin.get_url:
    url: >-
      https://storage.googleapis.com/minikube/releases/{{ minikube_target_version }}/minikube-linux-{{ minikube_arch }}
    dest: "{{ minikube_bin }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart minikube

- name: Install the minikube systemd unit
  ansible.builtin.template:
    src: minikube.service.j2
    dest: /etc/systemd/system/minikube.service
    mode: "0644"
  notify: Restart minikube

- name: Enable and start the minikube cluster
  ansible.builtin.systemd_service:
    name: minikube
    state: "{{ 'started' if minikube_start_cluster | bool else 'stopped' }}"
    enabled: "{{ minikube_start_cluster | bool }}"
    daemon_reload: true

- name: Apply pending restarts before probing the cluster
  ansible.builtin.meta: flush_handlers

- name: Stop here when the cluster is intentionally left down
  ansible.builtin.meta: end_host
  when: not (minikube_start_cluster | bool)

- name: Wait for the control-plane node to become Ready
  ansible.builtin.command: >-
    kubectl wait --for=condition=Ready nodes --all --timeout=300s
  become: true
  become_user: "{{ minikube_user }}"
  environment:
    HOME: "{{ minikube_home }}"
    MINIKUBE_HOME: "{{ minikube_home }}/.minikube"
  changed_when: false

- name: Enforce the node container's CPU limit
  # minikube's docker driver passes --cpus to `minikube start`, but on at
  # least this host it never turns into an actual `docker run --cpus`
  # constraint: verified live that a freshly (re)started cluster left
  # HostConfig.NanoCpus at 0 / cgroup cpu.max at "max" (unlimited) despite
  # requesting minikube_cpus, while --memory *was* correctly enforced as a
  # real cgroup limit. `docker update --cpus` applies live, no restart
  # needed, so this just re-asserts it after every start.
  when: minikube_cpus is number
  block:
    - name: Check the node container's current CPU limit
      ansible.builtin.command:
        argv: [docker, inspect, minikube, --format, "{{ '{{' }}.HostConfig.NanoCpus{{ '}}' }}"]
      register: minikube_current_nanocpus
      changed_when: false

    - name: Apply the CPU limit to the node container
      ansible.builtin.command:
        argv: [docker, update, "--cpus={{ minikube_cpus }}", minikube]
      when: (minikube_current_nanocpus.stdout | trim | int) != (minikube_cpus * 1000000000) | int
      changed_when: true

- name: Enable managed LimitedSwap kubelet behavior
  when: minikube_enable_limited_swap | bool
  block:
    # minikube always hardcodes `failSwapOn: false` into the generated
    # KubeletConfiguration, which is what lets kubelet start at all with swap
    # present — but that's the old, unmanaged way of tolerating swap. Real
    # Kubernetes swap support (KEP-2400) needs the `NodeSwap` feature gate and
    # `memorySwap.swapBehavior: LimitedSwap` in that same config, and neither
    # is reachable through minikube's `--feature-gates` or `--extra-config`
    # flags (the latter only whitelists 4 unrelated kubelet keys). So this
    # patches the generated file directly, inside the node container, and
    # restarts kubelet — verified against a live cluster: without this, every
    # container's memory.swap.max cgroup file reads "max" (unmanaged); with
    # it, containers that set a memory limit correctly get "0" (LimitedSwap
    # denies them swap) while limit-less containers keep "max".
    - name: Check whether LimitedSwap is already configured
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - minikube
          - sh
          - -c
          - "grep -q 'swapBehavior: LimitedSwap' /var/lib/kubelet/config.yaml && grep -q 'NodeSwap: true' /var/lib/kubelet/config.yaml"
      register: minikube_limited_swap_configured
      changed_when: false
      failed_when: false

    - name: Patch the kubelet config and restart kubelet
      when: minikube_limited_swap_configured.rc != 0
      block:
        - name: Set memorySwap.swapBehavior to LimitedSwap
          ansible.builtin.command:
            argv:
              - docker
              - exec
              - minikube
              - sed
              - -i
              - "s/^memorySwap: {}/memorySwap:\\n  swapBehavior: LimitedSwap/"
              - /var/lib/kubelet/config.yaml
          changed_when: true

        - name: Enable the NodeSwap kubelet feature gate
          ansible.builtin.command:
            argv:
              - docker
              - exec
              - minikube
              - sh
              - -c
              - "printf 'featureGates:\\n  NodeSwap: true\\n' >> /var/lib/kubelet/config.yaml"
          changed_when: true

        - name: Restart kubelet inside the minikube node to apply the new config
          ansible.builtin.command:
            argv: [docker, exec, minikube, systemctl, restart, kubelet]
          changed_when: true

        - name: Wait for the control-plane node to become Ready again
          ansible.builtin.command: >-
            kubectl wait --for=condition=Ready nodes --all --timeout=120s
          become: true
          become_user: "{{ minikube_user }}"
          environment:
            HOME: "{{ minikube_home }}"
            MINIKUBE_HOME: "{{ minikube_home }}/.minikube"
          changed_when: false

- name: Collect the current addon states
  ansible.builtin.command: "{{ minikube_bin }} addons list -o json"
  become: true
  become_user: "{{ minikube_user }}"
  environment:
    HOME: "{{ minikube_home }}"
    MINIKUBE_HOME: "{{ minikube_home }}/.minikube"
    MINIKUBE_IN_STYLE: "false"
  register: minikube_addons_state
  changed_when: false

- name: Enable the requested minikube addons
  ansible.builtin.command: "{{ minikube_bin }} addons enable {{ item }}"
  become: true
  become_user: "{{ minikube_user }}"
  environment:
    HOME: "{{ minikube_home }}"
    MINIKUBE_HOME: "{{ minikube_home }}/.minikube"
    MINIKUBE_IN_STYLE: "false"
  loop: "{{ minikube_addons | difference(minikube_addons_enabled) }}"
  changed_when: true
  vars:
    minikube_addons_enabled: >-
      {{ (minikube_addons_state.stdout | from_json) | dict2items
         | selectattr('value.Status', 'equalto', 'enabled')
         | map(attribute='key') | list }}

- name: Read the minikube user kubeconfig
  ansible.builtin.slurp:
    src: "{{ minikube_home }}/.kube/config"
  register: minikube_kubeconfig
  when: minikube_share_kubeconfig_with_root | bool or minikube_expose_apiserver | bool

- name: Share the kubeconfig with root
  when: minikube_share_kubeconfig_with_root | bool
  block:
    - name: Ensure /root/.kube exists
      ansible.builtin.file:
        path: /root/.kube
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Install the kubeconfig for root
      ansible.builtin.copy:
        content: "{{ minikube_kubeconfig.content | b64decode }}"
        dest: /root/.kube/config
        owner: root
        group: root
        mode: "0600"

- name: Export a kubeconfig for remote access
  when: minikube_expose_apiserver | bool
  block:
    - name: Discover the published API server host port
      ansible.builtin.command: "docker port minikube {{ minikube_apiserver_port }}/tcp"
      register: minikube_apiserver_port_raw
      changed_when: false

    - name: Ensure the output directory exists on the control node
      ansible.builtin.file:
        path: "{{ playbook_dir }}/output"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Write the remote-access kubeconfig to the control node
      ansible.builtin.copy:
        content: >-
          {{ (minikube_kubeconfig.content | b64decode)
             | regex_replace('server: https://[0-9.]+:[0-9]+',
                              'server: https://' ~ minikube_remote_access_host ~ ':' ~ minikube_apiserver_host_port) }}
        dest: "{{ playbook_dir }}/output/kubectl-{{ minikube_env_name }}.yaml"
        mode: "0600"
      delegate_to: localhost
      become: false
      vars:
        minikube_apiserver_host_port: "{{ minikube_apiserver_port_raw.stdout | trim | regex_replace('^.*:', '') }}"
