---
- name: Install Flux CLI
  when: flux_cli_install | bool
  block:
    - name: Check the installed flux version
      ansible.builtin.command: "{{ flux_cli_bin_dir }}/flux --version"
      register: flux_cli_installed
      changed_when: false
      failed_when: false

    - name: Resolve the latest flux version
      ansible.builtin.uri:
        url: https://api.github.com/repos/fluxcd/flux2/releases/latest
        return_content: true
      register: flux_cli_latest
      when: flux_cli_version == 'latest'
      changed_when: false
      failed_when: false

    - name: Set the target flux version
      ansible.builtin.set_fact:
        flux_cli_target_version: >-
          {{ (flux_cli_latest.json.tag_name | default(flux_cli_version))
             if flux_cli_version == 'latest' else flux_cli_version }}

    - name: Install flux
      when: flux_cli_target_version not in (flux_cli_installed.stdout | default(''))
      block:
        - name: Create temp directory for download
          ansible.builtin.tempfile:
            state: directory
            suffix: flux-install
          register: flux_cli_tmp

        - name: Download flux binary archive
          ansible.builtin.get_url:
            url: >-
              https://github.com/fluxcd/flux2/releases/download/{{ flux_cli_target_version }}/flux_{{ flux_cli_target_version[1:] }}_linux_{{ flux_cli_arch }}.tar.gz
            dest: "{{ flux_cli_tmp.path }}/flux.tar.gz"
            checksum: >-
              sha256:https://github.com/fluxcd/flux2/releases/download/{{ flux_cli_target_version }}/flux_{{ flux_cli_target_version[1:] }}_checksums.txt
            mode: "0644"

        - name: Extract flux binary
          ansible.builtin.unarchive:
            src: "{{ flux_cli_tmp.path }}/flux.tar.gz"
            dest: "{{ flux_cli_tmp.path }}"
            remote_src: true
            include:
              - flux

        - name: Install flux binary
          ansible.builtin.copy:
            src: "{{ flux_cli_tmp.path }}/flux"
            dest: "{{ flux_cli_bin_dir }}/flux"
            mode: "0755"
            remote_src: true

        - name: Clean up temp directory
          ansible.builtin.file:
            path: "{{ flux_cli_tmp.path }}"
            state: absent
