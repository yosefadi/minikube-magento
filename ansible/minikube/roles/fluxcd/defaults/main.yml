---
fluxcd_namespace: flux-system
fluxcd_helm_repo: https://fluxcd-community.github.io/helm-charts
fluxcd_chart_name: flux2
fluxcd_chart_version: 2.19.0
fluxcd_release_name: flux

fluxcd_storage_release_name: flux-storage
fluxcd_git_path_storage: ./kubernetes/gitops/base/infrastructure/openebs

# Separate from the main Kustomization for the same reason as storage above:
# Traefik's HelmRelease installs the IngressRoute CRD via helm-controller,
# asynchronously from kustomize-controller applying the raw IngressRoute
# manifest — in one Kustomization those race, and kustomize-controller's
# dry-run can hit the CRD before helm-controller has registered it. This
# Kustomization finishing (wait: true) is what the main one depends on.
fluxcd_traefik_release_name: flux-traefik
fluxcd_git_path_traefik: ./kubernetes/gitops/base/infrastructure/traefik

fluxcd_git_url: "ssh://git@github.com/yosefadi/minikube-magento.git"
fluxcd_git_branch: main
fluxcd_git_path: ./kubernetes/gitops

fluxcd_cli_install: true
fluxcd_cli_version: v2.9.3

fluxcd_ssh_key_path: "~/.ssh/id_ed25519"
fluxcd_ssh_key_remote: /tmp/fluxcd-ssh-key
