name: Build Magento Image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['magento/**', '.github/workflows/**']

# Serializes runs of this workflow so two overlapping builds can't race each
# other on the final git push (see the retry loop below, which handles the
# other half of this — a concurrent push from *outside* this workflow, e.g.
# a manual push, which a concurrency group can't prevent since it only
# queues workflow-triggered runs against each other). cancel-in-progress
# stays false: a queued run should wait, not cancel an in-flight image
# build+push over a newer commit landing.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository }}/magento

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract metadata
        id: meta
        shell: bash
        run: |
          MAGENTO_VERSION=$(grep '^ARG MAGENTO_VERSION=' magento/Dockerfile | cut -d'=' -f2)
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "magento_version=${MAGENTO_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${SHORT_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Create Docker config for Kaniko
        run: |
          mkdir -p /tmp/kaniko/.docker
          echo "{\"auths\":{\"ghcr.io\":{\"auth\":\"$(echo -n "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" | base64 | tr -d '\n')\"}}}" > /tmp/kaniko/.docker/config.json

      # php-fpm and nginx are two separate images (see magento/Dockerfile's
      # final-php / final-nginx targets) so nginx never ships a PHP
      # interpreter and neither image needs root to run.
      - name: Build and push php-fpm and nginx images with Kaniko
        id: build
        shell: bash
        run: |
          MAGENTO_VERSION="${{ steps.meta.outputs.magento_version }}"
          SHORT_SHA="${{ steps.meta.outputs.short_sha }}"

          for component in php nginx; do
            IMAGE_NAME="${IMAGE_BASE}-${component}"
            TAGS="${REGISTRY}/${IMAGE_NAME}:${MAGENTO_VERSION}-${SHORT_SHA}"

            if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
              TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:latest"
            fi

            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:${MAGENTO_VERSION}"
            fi

            IFS=',' read -ra TAGS_ARRAY <<< "${TAGS}"
            DEST_FLAGS=()
            for tag in "${TAGS_ARRAY[@]}"; do
              DEST_FLAGS+=("--destination=${tag}")
            done

            docker run --rm \
              -v "${GITHUB_WORKSPACE}:/workspace" \
              -v /tmp/kaniko/.docker/config.json:/kaniko/.docker/config.json:ro \
              gcr.io/kaniko-project/executor:latest \
              --context=/workspace/magento \
              --dockerfile=Dockerfile \
              --target="final-${component}" \
              "${DEST_FLAGS[@]}" \
              --cache=true \
              "--cache-repo=${REGISTRY}/${IMAGE_NAME}/cache" \
              --compressed-caching \
              --verbosity=info

            FIRST_TAG=$(echo "${TAGS}" | cut -d',' -f1)
            echo "${component}_tag=${FIRST_TAG}" >> "${GITHUB_OUTPUT}"
          done

      - name: Update deployment manifest with new image tags
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEPLOY_FILE="kubernetes/gitops/base/apps/magento/deployment.yaml"
          sed -i "s|image: ghcr\.io/.*/magento-php:.*|image: ${{ steps.build.outputs.php_tag }}|" "${DEPLOY_FILE}"
          sed -i "s|image: ghcr\.io/.*/magento-nginx:.*|image: ${{ steps.build.outputs.nginx_tag }}|" "${DEPLOY_FILE}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git diff --quiet -- "${DEPLOY_FILE}"; then
            echo "No image tag changes to commit."
            exit 0
          fi

          git add "${DEPLOY_FILE}"
          git commit -m "chore: update magento images to ${{ steps.build.outputs.php_tag }} / ${{ steps.build.outputs.nginx_tag }}"

          # main moves during a build often enough that a bare `git push`
          # here gets rejected outright as non-fast-forward — confirmed
          # live (a manual push landed while a build was running). Rebase
          # onto whatever's actually on the remote and retry instead of
          # failing the whole workflow over a push race. The concurrency
          # group above only serializes runs of *this* workflow against
          # each other; it can't stop an unrelated manual push, which is
          # what this loop is actually for.
          # actions/checkout@v4 defaults to a shallow clone (fetch-depth: 1),
          # which can leave the rebase below without a usable merge-base.
          # Unshallow once, up front, rather than inside the retry loop.
          git fetch --unshallow origin main 2>/dev/null || git fetch origin main

          pushed=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "::error::Rebase conflict updating ${DEPLOY_FILE} onto origin/main — needs manual resolution."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Pushed on attempt ${attempt}."
              pushed=true
              break
            fi
            echo "Push attempt ${attempt} failed, retrying..."
            sleep $((RANDOM % 10 + 5))
          done

          if [ "$pushed" != "true" ]; then
            echo "::error::Failed to push ${DEPLOY_FILE} update after 5 attempts."
            exit 1
          fi
