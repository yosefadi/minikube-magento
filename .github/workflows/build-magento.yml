name: Build Magento Image

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/magento

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract metadata
        id: meta
        shell: bash
        run: |
          MAGENTO_VERSION=$(grep '^ARG MAGENTO_VERSION=' magento/Dockerfile | cut -d'=' -f2)
          SHORT_SHA="${GITHUB_SHA::7}"

          TAGS="${REGISTRY}/${IMAGE_NAME}:${MAGENTO_VERSION}-${SHORT_SHA}"

          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:latest"
          fi

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:${MAGENTO_VERSION}"
          fi

          echo "tags=${TAGS}" >> "${GITHUB_OUTPUT}"
          echo "magento_version=${MAGENTO_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Create Docker config for GHCR
        run: |
          DOCKER_CONFIG_DIR="${RUNNER_TEMP}/docker-config"
          mkdir -p "${DOCKER_CONFIG_DIR}"
          echo "{\"auths\":{\"${REGISTRY}\":{\"auth\":\"$(echo -n "${GITHUB_ACTOR}:${GITHUB_TOKEN}" | base64 -w0)\"}}}" > "${DOCKER_CONFIG_DIR}/config.json"
          chmod 600 "${DOCKER_CONFIG_DIR}/config.json"
          echo "DOCKER_CONFIG_DIR=${DOCKER_CONFIG_DIR}" >> "${GITHUB_ENV}"

      - name: Build and push with Kaniko
        shell: bash
        run: |
          IFS=',' read -ra TAGS_ARRAY <<< "${{ steps.meta.outputs.tags }}"
          DEST_FLAGS=()
          for tag in "${TAGS_ARRAY[@]}"; do
            DEST_FLAGS+=("--destination=${tag}")
          done

          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${DOCKER_CONFIG_DIR}:/kaniko/.docker" \
            -e DOCKER_CONFIG=/kaniko/.docker \
            gcr.io/kaniko-project/executor:latest \
            --context=/workspace/magento \
            --dockerfile=Dockerfile \
            "${DEST_FLAGS[@]}" \
            --cache=true \
            "--cache-repo=${REGISTRY}/${IMAGE_NAME}/cache" \
            --compressed-caching \
            --verbosity=info
