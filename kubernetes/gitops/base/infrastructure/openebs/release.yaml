---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
  namespace: openebs
spec:
  interval: 10m
  timeout: 10m
  chart:
    spec:
      chart: openebs
      version: "4.x"
      sourceRef:
        kind: HelmRepository
        name: openebs
        namespace: openebs
      interval: 10m
  values:
    engines:
      local:
        lvm:
          enabled: false
        zfs:
          enabled: false
        rawfile:
          enabled: false
        hostpath:
          enabled: true
      replicated:
        mayastor:
          enabled: false
    localpv:
      hostpath:
        basePath: /var/openebs/local
    loki:
      enabled: false
    alloy:
      enabled: false
