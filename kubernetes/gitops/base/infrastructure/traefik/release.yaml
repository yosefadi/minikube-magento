---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: traefik
      version: "41.x"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
      interval: 10m
  values:
    # Chart defaults to LoadBalancer (spec.type), which minikube has no
    # cloud controller to satisfy — it'd sit in <pending> forever. NodePort
    # is reachable directly at <node-ip>:<nodePort>, no external
    # provisioner needed.
    service:
      spec:
        type: NodePort
    ports:
      web:
        nodePort: 30080
      websecure:
        nodePort: 30443
      # traefik.expose.default stays false (the chart default) — its own
      # values.yaml explicitly warns "you SHOULD NOT expose the traefik
      # port on production deployments... use kubectl port-forward or
      # create a secure ingress" for this port (8080, dashboard/API).
      # Deliberately not exposed on the public NodePort service here.
    # api.dashboard is already the chart default (true) — what's off by
    # default is the actual route to it.
    ingressRoute:
      dashboard:
        enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        memory: 128Mi
