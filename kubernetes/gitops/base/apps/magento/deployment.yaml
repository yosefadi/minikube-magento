---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: magento
  namespace: apps
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: magento
  template:
    metadata:
      labels:
        app.kubernetes.io/name: magento
    spec:
      # Both containers run as www-data (33). fsGroup makes the kubelet
      # chown the mounted PVCs to that group on attach, since a fresh PVC
      # otherwise mounts root-owned and neither container could write to it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
      initContainers:
        - name: init-app-etc
          image: ghcr.io/yosefadi/minikube-magento/magento-php:2.4.9-7644f95
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              if [ ! -f /mnt/app-etc/di.xml ]; then
                echo "app/etc PVC is empty — seeding from image..."
                cp -a /var/www/html/app/etc/. /mnt/app-etc/
              fi
          volumeMounts:
            - name: app-etc
              mountPath: /mnt/app-etc
      containers:
        - name: php-fpm
          image: ghcr.io/yosefadi/minikube-magento/magento-php:2.4.9-7644f95
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
              name: fastcgi
          envFrom:
            - configMapRef:
                name: magento-config
          env:
            - name: MAGENTO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: magento-credentials
                  key: db-password
            - name: MAGENTO_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: magento-credentials
                  key: admin-password
            - name: MAGENTO_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: magento-credentials
                  key: admin-user
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 150m
              memory: 224Mi
            limits:
              memory: 448Mi
          volumeMounts:
            - name: app-etc
              mountPath: /var/www/html/app/etc
            - name: pub-static
              mountPath: /var/www/html/pub/static
            - name: pub-media
              mountPath: /var/www/html/pub/media
        # nginx never sees the DB/admin secrets — it only needs the same
        # pub/static and pub/media PVCs to serve directly, plus a loopback
        # path to php-fpm's fastcgi port for everything else.
        - name: nginx
          image: ghcr.io/yosefadi/minikube-magento/magento-nginx:2.4.9-7644f95
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: pub-static
              mountPath: /var/www/html/pub/static
            - name: pub-media
              mountPath: /var/www/html/pub/media
      volumes:
        - name: app-etc
          persistentVolumeClaim:
            claimName: magento-etc
        - name: pub-static
          persistentVolumeClaim:
            claimName: magento-static
        - name: pub-media
          persistentVolumeClaim:
            claimName: magento-media
