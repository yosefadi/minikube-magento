services:
  mariadb:
    image: mariadb:12.3
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-magento}
      MARIADB_USER: ${MARIADB_USER:-magento}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      # Required since OpenSearch 2.12+ even with security disabled — the
      # demo installer checks for this before OpenSearch itself starts.
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.39.0
    # Dragonfly sizes its thread pool off the *host's* CPU count, not any
    # per-container limit, and wants ~256MiB of maxmemory per thread —
    # verified live that leaving this unset demands several GiB on a
    # many-core dev machine and refuses to start.
    command: ["--requirepass=${DRAGONFLY_PASSWORD}", "--proactor_threads=1", "--maxmemory=256mb"]
    user: "1000:1000"

  # magento-php and magento-nginx run as www-data, not root — mirroring
  # production where the pod's securityContext.fsGroup does this instead.
  # Docker/podman named volumes start out root-owned on first use, and
  # there's no fsGroup equivalent in plain compose, so this runs once to
  # hand the mountpoints to www-data (uid/gid 33) before either container
  # tries to write into them.
  volume-init:
    image: busybox
    command: ["chown", "-R", "33:33", "/var/www/html/app/etc", "/var/www/html/pub/media", "/var/www/html/pub/static"]
    volumes:
      - magento-etc:/var/www/html/app/etc
      - magento-media:/var/www/html/pub/media
      - magento-static:/var/www/html/pub/static

  magento-php:
    build:
      context: .
      target: final-php
    depends_on:
      volume-init:
        condition: service_completed_successfully
      mariadb:
        condition: service_started
      opensearch:
        condition: service_started
      dragonfly:
        condition: service_started
    environment:
      MAGENTO_BASE_URL: http://localhost:8080/
      MAGENTO_DB_HOST: mariadb
      MAGENTO_DB_NAME: ${MARIADB_DATABASE:-magento}
      MAGENTO_DB_USER: ${MARIADB_USER:-magento}
      MAGENTO_DB_PASSWORD: ${MAGENTO_DB_PASSWORD}
      MAGENTO_OPENSEARCH_HOST: opensearch
      MAGENTO_ADMIN_EMAIL: admin@example.com
      MAGENTO_ADMIN_PASSWORD: ${MAGENTO_ADMIN_PASSWORD}
      MAGENTO_DRAGONFLY_HOST: dragonfly
      MAGENTO_DRAGONFLY_PASSWORD: ${DRAGONFLY_PASSWORD}
      # Matches the k8s configmap's non-default admin path — see
      # kubernetes/gitops/base/apps/magento/configmap.yaml.
      MAGENTO_BACKEND_FRONTNAME: panel
    # nginx joins this service's network namespace below (mirroring how
    # they'll share a network namespace as two containers in one k8s pod),
    # so the host port mapping lives here even though nginx is what's
    # actually listening on 8080.
    ports:
      - "8080:8080"
    volumes:
      # Without this, every container restart re-runs the full installer
      # against a database that already has tables and fails — see the
      # entrypoint's env.php check.
      - magento-etc:/var/www/html/app/etc
      - magento-media:/var/www/html/pub/media
      # Without this, static content gets redeployed on every restart —
      # harmless but slow (the entrypoint checks for it independently of
      # env.php, since they're separate volumes and either can be missing).
      - magento-static:/var/www/html/pub/static

  magento-nginx:
    build:
      context: .
      target: final-nginx
    depends_on:
      - magento-php
    # Same network namespace as magento-php — nginx proxies to php-fpm over
    # 127.0.0.1:9000, exactly like two containers sharing one k8s pod.
    network_mode: "service:magento-php"
    volumes:
      - magento-media:/var/www/html/pub/media
      - magento-static:/var/www/html/pub/static

volumes:
  mariadb-data:
  opensearch-data:
  magento-etc:
  magento-media:
  magento-static:
