; Magento-recommended PHP settings (https://devdocs.magento.com/guides/v2.4/install-gde/prereq/apache.html)
memory_limit = 2G
max_execution_time = 18000
zlib.output_compression = Off
short_open_tag = Off

; date.timezone must be set for CLI (setup:di:compile, cron, etc.) to work.
date.timezone = UTC

realpath_cache_size = 10M
realpath_cache_ttl = 7200

opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 512
opcache.max_accelerated_files = 60000
opcache.consistency_checks = 0
opcache.save_comments = 1
opcache.revalidate_freq = 0
; Set to 0 (and restart php-fpm on deploy) for production; 1 is friendlier for
; iterating on custom code without a container rebuild.
opcache.validate_timestamps = 1
