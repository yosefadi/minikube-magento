upstream fastcgi_backend {
    server 127.0.0.1:9000;
}

server {
    listen 8080;
    server_name _;

    set $MAGE_ROOT /var/www/html;
    # Static content is pre-deployed at build time, so nginx should serve it
    # directly (404 on a miss) rather than falling back to get.php the way
    # "default"/developer mode does.
    set $MAGE_MODE production;

    include /var/www/html/nginx.conf.sample;
}
